name: Compilar Web y Android

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    name: Prueba de humo
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importar y ejecutar prueba automática
        run: |
          godot --headless --path . --import || true
          timeout 180 godot --headless --path . -- --smoke 2>&1 | tee smoke.log
          grep -q "SMOKE OK" smoke.log

  web:
    name: Exportar Web
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar plantillas
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Exportar
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Publicar en GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Exportar APK Android (debug)
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar plantillas, SDK y keystore de depuración
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          ln -sfn /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JDK="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          KS=/root/debug.keystore
          if [ ! -f "$KS" ]; then
            KS="$PWD/debug.keystore"
            keytool -genkeypair -v -keystore "$KS" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "SDK=$SDK JDK=$JDK KS=$KS"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$SDK" "$JDK" "$KS" > ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KS" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV
      - name: Exportar APK
        run: |
          mkdir -p build/android
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/android/PAPO-Garbage-Tycoon.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: PAPO-Garbage-Tycoon-APK
          path: build/android/PAPO-Garbage-Tycoon.apk
